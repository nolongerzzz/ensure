name: self-test

# Tests Ensure against its own demo. A failure here means src/ensure-grade.js
# or src/checks-browser.js regressed, not that any real app broke.
#
# Both demo.json (all real, all expected to pass) and negative-controls.json
# (all deliberately mismatched, all expected to fail for a stated reason)
# should produce ZERO surprises. If negative-controls.json ever passes
# cleanly instead of producing its expected failures, grading has gone too
# permissive — that's exactly what these exist to catch.
#
# npm run self-test starts and stops the demo server itself (replay/
# demo-server.js, no external server package), so there is no backgrounded
# process to leak between steps.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Self-test (positive checks + negative controls)
        env:
          # Ensure eats its own dog food: a grading regression that reaches
          # main (or a deliberate manual run) files itself as an issue, the
          # same path checks against a real app use. Not on pull_request —
          # there the failed check is already the signal and an issue would
          # be noise. Empty string is falsy in the runner's check, so no
          # token means no filing.
          GITHUB_TOKEN: ${{ github.event_name != 'pull_request' && secrets.GITHUB_TOKEN || '' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run self-test
