name: ensure-checks

# Runs the real checks against nest-optimizer's live Pages deploy. Needs a
# checkout of nest-optimizer itself (not just Ensure) because assetHash
# checks compare live-served bytes against the committed source.

on:
  # checks/nest-optimizer.json's selectors are now verified against the real
  # index.html, so the original reason for holding the cron back is gone.
  # Scheduling is still deliberately left off: this job files GitHub issues on
  # a surprise, so turn it on only once you've watched a few manual runs and
  # know how often nest-optimizer actually deploys. Uncomment to enable.
  # schedule:
  #   - cron: '0 * * * *'   # hourly; adjust once you know how often deploys happen
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  ensure-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Ensure
        uses: actions/checkout@v5
        with:
          path: ensure

      - name: Check out nest-optimizer
        uses: actions/checkout@v5
        with:
          repository: nolongerzzz/nest-optimizer
          path: nest-optimizer

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ensure/package-lock.json

      - name: Install dependencies
        working-directory: ensure
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ensure
        run: npx playwright install --with-deps chromium

      # checks/nest-optimizer.json's selectors were confirmed against the real
      # index.html and exercised in a real browser, so a red run here should be
      # read as a genuine signal about the deploy rather than a bad guess.
      - name: Run checks against live Pages
        working-directory: ensure
        env:
          APP_URL: https://nolongerzzz.github.io/nest-optimizer/
          REPO_CHECKOUT_DIR: ../nest-optimizer
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node replay/ensure-run.js checks/nest-optimizer.json
